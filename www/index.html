<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020202">
<meta name="color-scheme" content="dark">
<title>DEATH</title>
<style>
:root{
  --bg:#020202;--panel:#080808;--panel2:#0d0d0d;--text:#efefef;--muted:#8b8b8b;
  --line:#171717;--red:#e31324;--red2:#65050c;--amber:#c9ad61;--green:#56dd9d;
  --shadow:0 30px 110px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{overflow-x:hidden}
button,input,select{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--red);outline-offset:2px}
img,video{display:block;max-width:100%}
.no-scroll{overflow:hidden}
::selection{background:rgba(227,19,36,.45);color:#fff}

/* ---------- cinematic / analog texture ---------- */
.crt-lines,.film-grain,.signal-layer,.red-flash,.cctv-vignette{
  position:fixed;inset:0;pointer-events:none
}
.crt-lines{z-index:9996;opacity:.28;background:repeating-linear-gradient(to bottom,transparent 0 3px,rgba(255,255,255,.035) 4px,transparent 5px)}
.film-grain{z-index:9995;opacity:.045;background-image:radial-gradient(rgba(255,255,255,.7) .45px,transparent .6px);background-size:4px 4px;animation:grain .14s steps(2) infinite}
.cctv-vignette{z-index:9994;background:radial-gradient(circle at center,transparent 44%,rgba(0,0,0,.58) 100%)}
.signal-layer{z-index:9998;display:none;opacity:0;background:
  repeating-linear-gradient(to bottom,rgba(255,255,255,.12) 0 1px,transparent 1px 5px),
  linear-gradient(90deg,transparent 0 18%,rgba(227,19,36,.12) 20%,transparent 23%);
  mix-blend-mode:screen
}
.signal-layer.active{display:block;animation:signal .24s steps(2) 2}
.red-flash{z-index:9997;opacity:0;background:rgba(227,19,36,.12)}
.red-flash.active{animation:redFlash .34s ease 1}
body.shake{animation:shake .14s steps(2) 1}
@keyframes grain{0%{transform:translate(0,0)}25%{transform:translate(-1%,1%)}50%{transform:translate(1%,-1%)}75%{transform:translate(1%,1%)}100%{transform:translate(0,0)}}
@keyframes signal{0%{opacity:0;transform:translateX(0)}25%{opacity:.7;transform:translateX(-3px)}45%{opacity:.15;transform:translateX(5px)}70%{opacity:.8;transform:translateX(-1px)}100%{opacity:0;transform:translateX(0)}}
@keyframes redFlash{0%,100%{opacity:0}35%{opacity:1}70%{opacity:.2}}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(-2px,1px)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px)}100%{transform:translate(0)}}
@media(prefers-reduced-motion:reduce){.film-grain{animation:none}.signal-layer,.red-flash,body.shake{animation:none!important}}

/* ---------- chrome ---------- */
.top{position:sticky;top:0;z-index:40;height:64px;background:rgba(2,2,2,.84);backdrop-filter:blur(18px);border-bottom:1px solid #101010;display:flex;align-items:center;justify-content:space-between;padding:0 15px}
.logo{font-weight:950;letter-spacing:.31em;font-size:15px}.logo b{color:var(--red)}
.top-actions{display:flex;gap:7px;align-items:center}
.btn{border:1px solid #202020;background:#0d0d0d;color:#fff;border-radius:999px;padding:10px 14px;font-weight:850;transition:.18s}
.btn:hover{background:#141414;transform:translateY(-1px)}
.btn.primary{background:var(--red);border-color:transparent}.btn.primary:hover{background:#c70f1d}
.icon{width:39px;height:39px;padding:0;display:grid;place-items:center}
.pill{position:fixed;right:11px;top:75px;z-index:45;display:flex;align-items:center;gap:7px;background:rgba(9,9,9,.9);border:1px solid #1b1b1b;border-radius:999px;padding:7px 10px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#8e8e8e;letter-spacing:.09em}
.pill .live-dot{width:5px;height:5px;border-radius:50%;background:#555}.pill.live .live-dot{background:var(--red);box-shadow:0 0 9px var(--red)}
.pill button{background:none;border:0;color:#fff;padding:0}

.page{width:100%;max-width:1180px;margin:auto;padding:14px 15px 120px}
.archive-strip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 2px 10px;min-width:0;overflow:hidden}
.archive-mono{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#6e6e6e;letter-spacing:.12em;white-space:nowrap}
.archive-depth{color:#b3b3b3}
.archive-depth strong{color:#fff}
.archive-corrupt{color:var(--red)!important;text-shadow:1px 0 rgba(255,0,0,.5),-1px 0 rgba(0,150,255,.25)}
.anomaly-text{min-height:13px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;color:#666;text-transform:uppercase}

.hero{position:relative;min-height:67vh;border:1px solid #181818;border-radius:27px;overflow:hidden;background:#050505;display:flex;align-items:flex-end;padding:30px;box-shadow:var(--shadow)}
.hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.38;filter:brightness(.48) saturate(.72)}
.hero-shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.98),rgba(0,0,0,.08) 62%,rgba(0,0,0,.52))}
.hero-scan{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 5px,rgba(255,255,255,.03) 6px,transparent 7px)}
.hero-content{position:relative;z-index:2;max-width:720px}
.eyebrow{font:950 10px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.21em;color:#ff6570;text-transform:uppercase}
.hero h1{font-size:clamp(52px,12vw,112px);line-height:.82;letter-spacing:-.07em;margin:8px 0 16px}
.hero p{color:#aaa;line-height:1.65;max-width:630px}
.hero-meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}.badge{border:1px solid #292929;background:rgba(8,8,8,.78);padding:6px 9px;border-radius:999px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa;letter-spacing:.08em}
.badge.red{border-color:#541017;color:#ff7c84;background:#18080a}

.story-line{display:flex;gap:8px;align-items:center;margin:14px 0;padding:10px 12px;border:1px solid #181818;border-radius:15px;background:linear-gradient(90deg,#090909,#080405)}
.story-dot{width:6px;height:6px;border-radius:50%;background:#555;flex:0 0 auto}.story-line.live .story-dot{background:var(--red);box-shadow:0 0 10px var(--red)}
.story-copy{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#777;letter-spacing:.1em}
.story-copy b{color:#ddd}

.searchbar{display:flex;gap:7px;margin:16px 0 9px}
.search{width:100%;min-width:0;background:#090909;border:1px solid #1a1a1a;color:#fff;border-radius:15px;padding:14px 15px;outline:none}
.search:focus{border-color:#5e1118;box-shadow:0 0 0 3px rgba(227,19,36,.08)}
.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none;padding-bottom:2px}.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid #181818;background:#090909;color:#888;border-radius:999px;padding:8px 11px;font-size:10px}
.chip.active{color:#fff;border-color:#62131a;background:#19080b}

.section-head{display:flex;justify-content:space-between;align-items:end;gap:10px;margin:27px 0 11px}.section-head h2{margin:0;font-size:20px}.section-head p{margin:4px 0 0;color:#6e6e6e;font-size:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:720px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1040px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}

.card{position:relative;min-height:255px;border:1px solid #181818;border-radius:19px;overflow:hidden;background:#090909;cursor:pointer;transition:.22s transform,.22s border-color,.22s filter}
.card:hover{transform:translateY(-4px);border-color:#353535}
.card-visual{position:relative;min-height:255px;background:radial-gradient(circle at 70% 20%,rgba(227,19,36,.16),transparent 25%),linear-gradient(145deg,#191919,#070707)}
.card img{width:100%;height:255px;object-fit:cover;filter:saturate(.76) contrast(1.05)}
.card-fog{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.97),rgba(0,0,0,.05) 68%)}
.card-vhs{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 5px,rgba(255,255,255,.025) 6px,transparent 7px);mix-blend-mode:screen}
.card-status{position:absolute;top:9px;left:9px;z-index:2;display:flex;gap:5px;flex-wrap:wrap}
.card-body{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:13px}
.card-tag{font:950 9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#ff6570;letter-spacing:.14em}
.card h3{margin:5px 0;font-size:16px}.card p{margin:0;color:#aaa;font-size:11px;line-height:1.45}
.card-meta{display:flex;align-items:center;justify-content:space-between;gap:7px;margin-top:9px;color:#777;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}
.save-mini{border:1px solid #272727;background:rgba(8,8,8,.8);color:#fff;border-radius:999px;padding:5px 8px}
.save-mini.saved{color:#ff6c76;border-color:#4c0f16}

.recovered{
  margin-top:11px;border:1px dashed #252525;border-radius:16px;padding:11px;
  font:9px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#747474
}
.recovered strong{color:#aaa}.redaction{display:inline-block;min-width:60px;background:#191919;color:#191919;padding:0 3px;border-radius:2px;vertical-align:middle}

.empty{padding:55px 18px;text-align:center;border:1px dashed #202020;border-radius:20px}.empty h3{margin:10px 0}.empty p{color:#777;line-height:1.55;max-width:500px;margin:auto}

.nav{position:fixed;left:50%;bottom:9px;transform:translateX(-50%);z-index:60;width:min(720px,calc(100% - 18px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px;border:1px solid #1b1b1b;border-radius:23px;background:rgba(9,9,9,.91);backdrop-filter:blur(17px);box-shadow:0 18px 60px rgba(0,0,0,.5)}
.nav button{border:0;background:transparent;color:#707070;border-radius:16px;padding:9px 3px;font-size:9px}.nav button.active{background:#161616;color:#fff}.nav b{display:block;font-weight:850;margin-top:3px}

.empty-archive{padding:30px;border:1px solid #1a1a1a;border-radius:18px;background:#080808}
.archive-row{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #141414}.archive-row:last-child{border-bottom:0}
.archive-row .file{font:10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#aaa;flex:1}.archive-row .status{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#666}

.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.9);backdrop-filter:blur(16px);display:grid;place-items:end center;padding:7px}
.modalbox{width:min(860px,100%);max-height:95vh;overflow:auto;background:#070707;border:1px solid #222;border-radius:25px 25px 12px 12px;padding:13px;box-shadow:0 30px 110px rgba(0,0,0,.75);-webkit-overflow-scrolling:touch}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:rgba(7,7,7,.9);backdrop-filter:blur(10px);padding-bottom:8px}
.close{width:40px;height:40px;border:0;background:#151515;color:#fff;border-radius:11px}
.modal-media{border:1px solid #171717;border-radius:18px;overflow:hidden;background:#000;margin-top:5px}
.modal-media video,.modal-media img{width:100%;max-height:58vh;object-fit:contain;background:#000}
.modal-progress{height:3px;border-radius:99px;overflow:hidden;background:#171717;margin-top:7px}.modal-progress b{display:block;width:0;height:100%;background:var(--red)}
.modal-copy{color:#aaa;line-height:1.7;font-size:13px;margin:13px 0}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.detail{border:1px solid #171717;background:#0a0a0a;border-radius:14px;padding:11px}.detail strong{display:block;font:850 10px ui-monospace,SFMono-Regular,Menlo,monospace;color:#bbb}.detail span{display:block;color:#666;font-size:10px;margin-top:4px}
.warning{padding:12px;border:1px solid #493d18;background:#161209;border-radius:14px;color:#d0b66d;font-size:11px;line-height:1.5;margin:11px 0}
.decode{padding:25px 8px;text-align:center;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.14em;color:#777}.decode strong{display:block;color:#fff;margin-top:9px}
.progress-copy{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:#666;margin-top:5px}
.corrupt-note{font:9px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--red);letter-spacing:.12em;margin:8px 0}

.settings-card{border:1px solid #181818;border-radius:18px;background:#090909;padding:15px;margin-top:12px}
.settings-card h3{margin:0 0 6px}.settings-card p{color:#777;font-size:11px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;gap:7px}
.status-chip{border:1px solid #222;background:#0b0b0b;color:#777;border-radius:999px;padding:6px 9px;font:9px ui-monospace,SFMono-Regular,Menlo,monospace}

.depth-4 .card:nth-child(4n){filter:contrast(1.06)}
.depth-5 .card:nth-child(5n){transform:translateX(.5px)}
.depth-6 .card:nth-child(3n){filter:brightness(.93) contrast(1.08)}
.depth-7 .card:nth-child(2n){filter:saturate(.62) contrast(1.1)}

@media(max-width:620px){
  .top{padding:0 10px}.logo{font-size:13px}.top-actions .hide-mobile{display:none}
  .page{padding:9px 10px 115px}.hero{min-height:67vh;padding:22px;border-radius:22px}
  .hero h1{font-size:clamp(48px,17vw,76px)}.hero p{font-size:12px}
  .grid{gap:8px}.card{min-height:220px}.card-visual,.card img{height:220px;min-height:220px}
  .detail-grid{grid-template-columns:1fr}.modal{padding:5px}.modalbox{max-height:96vh;border-radius:21px}
  .modal-media video,.modal-media img{max-height:48vh}
  .archive-strip{gap:5px}.archive-strip .hide-mobile{display:none}
}
@media(max-width:380px){.hero{min-height:64vh}.hero-meta{display:none}.btn{padding:9px 11px}.nav button{font-size:8px}}

.death-loader{position:fixed;inset:0;z-index:10000;background:#000;color:#eee;display:grid;place-items:center;overflow:hidden;transition:opacity .55s ease,visibility .55s ease}
.death-loader.is-gone{opacity:0;visibility:hidden;pointer-events:none}
.loader-space{position:absolute;inset:0;background:radial-gradient(circle at 50% 52%,rgba(70,70,70,.06),transparent 32%),radial-gradient(circle at 20% 30%,rgba(255,255,255,.08) 0 1px,transparent 1.5px),radial-gradient(circle at 80% 20%,rgba(255,255,255,.06) 0 1px,transparent 1.5px),radial-gradient(circle at 65% 78%,rgba(255,255,255,.07) 0 1px,transparent 1.5px);background-size:auto,170px 150px,230px 190px,280px 220px;animation:loaderDrift 12s linear infinite}
.loader-vignette{position:absolute;inset:0;background:radial-gradient(circle,transparent 35%,rgba(0,0,0,.8) 100%)}
.loader-content{position:relative;z-index:2;width:min(560px,calc(100% - 40px));font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.loader-kervyra{font-size:9px;letter-spacing:.32em;color:#707070;margin-bottom:15px}
.loader-code{font-size:10px;letter-spacing:.18em;color:#aaa;margin-bottom:28px}
.loader-status{font-size:13px;letter-spacing:.12em;color:#e9e9e9;min-height:20px}
.loader-data{font-size:9px;letter-spacing:.12em;color:#666;margin-top:10px;min-height:16px}
.loader-progress{height:2px;background:#171717;margin-top:18px;overflow:hidden}.loader-progress b{display:block;width:0;height:100%;background:#e31324;transition:width .18s linear}
.loader-percent{font-size:9px;color:#777;margin-top:7px;text-align:right}
.loader-quote{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);width:min(600px,calc(100% - 40px));text-align:center;z-index:3;font-size:clamp(12px,2vw,17px);line-height:1.75;letter-spacing:.08em;color:#b7b7b7;opacity:0;transition:opacity .45s ease}.loader-quote.show{opacity:1}.loader-quote em{display:block;color:#fff;font-style:normal}
@keyframes loaderDrift{from{transform:scale(1)}to{transform:scale(1.04) translate3d(0,-1%,0)}} 
@media(max-width:620px){.loader-code{font-size:9px}.loader-status{font-size:11px}.loader-quote{bottom:13%;font-size:12px}}

</style>
</head>
<body>
<div class="crt-lines" aria-hidden="true"></div>
<div class="film-grain" aria-hidden="true"></div>
<div class="cctv-vignette" aria-hidden="true"></div>
<div class="signal-layer" id="signalLayer" aria-hidden="true"></div>
<div class="red-flash" id="redFlash" aria-hidden="true"></div>


<div id="deathLoader" class="death-loader" aria-hidden="true">
  <div class="loader-space" id="loaderSpace"></div>
  <div class="loader-vignette"></div>
  <div class="loader-content">
    <div class="loader-kervyra">KERVYRA STUDIOS</div>
    <div class="loader-code">DEATH // FORBIDDEN ARCHIVE</div>
    <div class="loader-status" id="loaderStatus">SEARCHING THE KNOWN UNIVERSE...</div>
    <div class="loader-data" id="loaderData">KNOWN DATA ................. SCANNING</div>
    <div class="loader-progress"><b id="loaderProgress"></b></div>
    <div class="loader-percent" id="loaderPercent">00%</div>
  </div>
  <div class="loader-quote" id="loaderQuote"></div>
</div>

<div id="app"></div>
<div class="pill" id="audioPill"><span class="live-dot"></span><span id="audioLabel">DEATH AUDIO OFF</span><button id="mute" aria-label="Toggle DEATH soundtrack">🔇</button></div>

<nav class="nav" aria-label="Primary">
  <button data-v="home" class="active">◉<b>Discover</b></button>
  <button data-v="archive">▣<b>Archive</b></button>
  <button data-v="saved">♡<b>Saved</b></button>
  <button data-v="settings">⚙<b>Settings</b></button>
</nav>

<script>
"use strict";

const app=document.getElementById("app");
const signalLayer=document.getElementById("signalLayer");
const redFlash=document.getElementById("redFlash");
const audioPill=document.getElementById("audioPill");
const audioLabel=document.getElementById("audioLabel");
const mute=document.getElementById("mute");

const KEYS={
  saved:"death_saved",
  viewed:"death_viewed",
  audio:"death_audio",
  resume:"death_resume",
  depth:"death_depth",
  known:"death_known_posts",
  filter:"death_filter"
};

const DEPTH_NAMES=[
  "NORMAL ARCHIVE",
  "SUBTLE DISTURBANCE",
  "INTERFERENCE",
  "SIGNAL DEGRADATION",
  "UNSTABLE INTERFACE",
  "RESTRICTED",
  "DEEP / UNKNOWN"
];

const ANOMALIES=[
  "SIGNAL DETECTED",
  "USER ACTIVITY DETECTED",
  "FILE STATUS: CORRUPTED",
  "ARCHIVE INTEGRITY: UNCERTAIN",
  "SOURCE UNKNOWN",
  "NEW DISCOVERY DETECTED",
  "DECODING RECOVERED DATA",
  "SIGNAL LOSS // RECONNECTING"
];

let state={
  view:"home",q:"",cat:load(KEYS.filter,"All"),posts:[],
  saved:load(KEYS.saved,[]),viewed:load(KEYS.viewed,[]),
  audio:load(KEYS.audio,false),depth:clamp(Number(load(KEYS.depth,1)),1,7),
  currentId:null,currentVideo:null,modal:null
};

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function load(k,d){try{const x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function nowStamp(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function fileCode(id){
  const s=String(id||"").replace(/-/g,"").toUpperCase();
  let n=0;for(let i=0;i<s.length;i++)n=(n*31+s.charCodeAt(i))>>>0;
  return String(n%99999+1).padStart(5,"0");
}
function depthName(){return DEPTH_NAMES[state.depth-1]}
function setDepth(n){
  const d=clamp(n,1,7);
  if(d!==state.depth){
    state.depth=d;save(KEYS.depth,d);
    document.body.classList.remove(...[1,2,3,4,5,6,7].map(x=>"depth-"+x));
    document.body.classList.add("depth-"+d);
    if(d>=4)signal("ARCHIVE DEPTH: "+String(d).padStart(2,"0"));
  }
}
function advanceDepth(reason=""){
  const viewed=state.viewed.length;
  const known=Number(load("death_depth_events",0))+1;
  save("death_depth_events",known);
  let bump=false;
  if(state.depth===1&&(viewed>=2||known>=5))bump=true;
  if(state.depth===2&&(viewed>=4||known>=10))bump=true;
  if(state.depth===3&&(viewed>=6||known>=16))bump=true;
  if(state.depth===4&&(viewed>=9||known>=24))bump=true;
  if(state.depth===5&&(viewed>=12||known>=32))bump=true;
  if(state.depth===6&&(viewed>=16||known>=42))bump=true;
  if(bump)setDepth(state.depth+1);
}
function filtered(){
  let a=state.posts.slice();
  if(state.view==="saved")a=a.filter(p=>state.saved.includes(p.id));
  if(state.cat!=="All")a=a.filter(p=>p.category===state.cat);
  if(state.q){
    const q=state.q.toLowerCase();
    a=a.filter(p=>(p.title+" "+p.description+" "+p.category).toLowerCase().includes(q));
  }

function signal(message){
  const label=document.getElementById("anomalyLabel");
  if(label){
    label.textContent=message+" // "+nowStamp();
    label.classList.remove("archive-corrupt");
    void label.offsetWidth;
    label.classList.add("archive-corrupt");
    setTimeout(()=>{if(label)label.classList.remove("archive-corrupt")},900);
  }
  if(Math.random()<.7){
    signalLayer.classList.remove("active");void signalLayer.offsetWidth;signalLayer.classList.add("active");
  }
  if(Math.random()<.22){
    redFlash.classList.remove("active");void redFlash.offsetWidth;redFlash.classList.add("active");
  }
  if(state.depth>=5&&Math.random()<.16){
    document.body.classList.add("shake");setTimeout(()=>document.body.classList.remove("shake"),170);
  }
}

function rareEvent(){
  if(document.hidden){setTimeout(rareEvent,12000);return}
  const probabilities=[.03,.06,.10,.13,.17,.21,.26];
  const p=probabilities[state.depth-1]||.06;
  if(Math.random()<p){
    const candidates=ANOMALIES.slice(0,state.depth>=5?ANOMALIES.length:6);
    signal(candidates[Math.floor(Math.random()*candidates.length)]);
  }
  const base=[30000,27000,24000,21000,18000,15000,11500][state.depth-1]||24000;
  setTimeout(rareEvent,base+Math.random()*base);
}

function corruptText(s){
  if(!s)return "";
  const glyphs=["█","░","▒","/","_","?","•"];
  return s.split("").map(ch=>{
    if(ch===" "||Math.random()>.12)return ch;
    return glyphs[Math.floor(Math.random()*glyphs.length)];
  }).join("");
}

async function api(url,opt={}){
  try{
    const headers={"Content-Type":"application/json",...(opt.headers||{})};
    const r=await fetch(url,{...opt,headers});
    const j=r.status===204?null:await r.json().catch(()=>({}));
    if(!r.ok)throw new Error(j?.error||"REQUEST_FAILED");
    return j;
  }catch(e){
    if(e instanceof TypeError)throw new Error("NETWORK");
    throw e;
  }
}

function rememberViewed(id){

  }
}

function toggleSave(id,redraw=true){
  state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];

    const code=prompt("CLASSIFIED FILE // ACCESS CODE:");
    if(!code)return;
    api("/api/posts/"+encodeURIComponent(id)+"/access",{method:"POST",body:JSON.stringify({passcode:code})})
      .then(full=>openViewer(full))
      .catch(e=>toast(e.message==="Access denied."?"ACCESS DENIED":"ACCESS VERIFICATION FAILED"));
    return;
  }
  openViewer(p);
}

  document.body.appendChild(m);

      video.addEventListener("timeupdate",()=>{
        const t=video.currentTime||0;

  },520);

    state.posts=Array.isArray(posts)?posts:[];
    render();

}

document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.modal)closeAnyModal()});
document.addEventListener("visibilitychange",()=>{if(document.hidden&&state.currentVideo)state.currentVideo.pause()});

function scheduleAnomaly(){
  if(document.hidden){setTimeout(scheduleAnomaly,12000);return}
  const p=[.02,.045,.07,.10,.14,.18,.23][state.depth-1];
  if(Math.random()<p){
    const allowed=state.depth>=6?ANOMALIES:ANOMALIES.slice(0,6);
    signal(allowed[Math.floor(Math.random()*allowed.length)]);
  }
  const base=[30000,28000,25000,22000,19000,16000,12500][state.depth-1];
  setTimeout(scheduleAnomaly,base+Math.random()*base);
}

setInterval(()=>{
  if(document.hidden)return;
  if(state.depth>=4&&Math.random()<0.05){
    const n=document.getElementById("noteAnomaly");
    if(n){n.textContent=corruptText(n.textContent||"ARCHIVE INTEGRITY: UNCERTAIN");setTimeout(()=>{if(n)n.textContent=state.depth>=5?"ARCHIVE HAS RECORDED YOUR PRESENCE.":"NOTHING UNUSUAL DETECTED."},450)}
  }
},18000);

updateAudio();
fetchPosts();
render();
setTimeout(scheduleAnomaly,11000);
</script>

<script>
(function(){
  const loader=document.getElementById("deathLoader"),status=document.getElementById("loaderStatus"),data=document.getElementById("loaderData"),bar=document.getElementById("loaderProgress"),pct=document.getElementById("loaderPercent"),quote=document.getElementById("loaderQuote");
  if(!loader||!status||!data||!bar||!pct)return;
  const returning=localStorage.getItem("death_loader_seen")==="1",duration=returning?1200:3600,start=performance.now();
  const phases=[
    ["SEARCHING THE KNOWN UNIVERSE...","KNOWN DATA ................. SCANNING"],
    ["KNOWN DATA ................ COMPLETE","MAPPED REGIONS ............ COMPLETE"],
    ["SEARCHING BEYOND KNOWN SPACE...","UNIDENTIFIED OBJECTS ...... 1,847"],
    ["UNMAPPED REGION DETECTED","SOURCE .................... UNKNOWN"],
    ["SEARCH COMPLETE","SOMETHING FOUND"]
  ];
  function frame(now){
    const t=Math.min(1,(now-start)/duration),e=t*t*(3-2*t),phase=Math.min(phases.length-1,Math.floor(t*phases.length)),value=Math.floor(e*100);
    status.textContent=phases[phase][0];data.textContent=phases[phase][1];bar.style.width=value+"%";pct.textContent=String(value).padStart(2,"0")+"%";
    if(!returning&&t>.64&&!quote.classList.contains("show")){quote.innerHTML="<em>THE UNKNOWN IS NOT EMPTY.</em>WE JUST HAVEN'T FOUND IT YET.";quote.classList.add("show")}
    if(t<1){requestAnimationFrame(frame);return}
    status.textContent="ARCHIVE ACCESS GRANTED";data.textContent="DEATH // THE FORBIDDEN ARCHIVE";
    setTimeout(()=>{loader.classList.add("is-gone");localStorage.setItem("death_loader_seen","1");setTimeout(()=>loader.remove(),650)},returning?80:500);
  }
  requestAnimationFrame(frame);
})();
</script>
